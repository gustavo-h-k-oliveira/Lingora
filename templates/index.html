<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lingora — Run Conversation</title>
    <style>
      body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial; padding: 2rem; }
      button { padding: .6rem 1rem; font-size: 1rem; }
      pre { background:#f6f8fa; padding:1rem; border-radius:6px; overflow:auto }
      .status { margin-top: 1rem }
    </style>
  </head>
  <body>
    <h1>Lingora — Run Conversation</h1>
    <p>Clique no botão para enviar a requisição e salvar a conversa em <code>data/conversations.json</code>.</p>

    <label for="question">Pergunta (opcional):</label>
    <input id="question" type="text" style="width:60%" placeholder="How many r's are in the word 'strawberry'?" />
    <button id="run">Enviar</button>

    <div class="status" id="status"></div>

    <h2>Resposta</h2>
    <pre id="output">Nenhuma execução ainda.</pre>

    <script>
      const runBtn = document.getElementById('run')
      const output = document.getElementById('output')
      const status = document.getElementById('status')
      const questionInput = document.getElementById('question')

      runBtn.addEventListener('click', async () => {
        status.textContent = 'Enviando...'
        output.textContent = ''
        try {
          const question = questionInput.value.trim() || undefined
          const resp = await fetch('/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question })
          })
          const data = await resp.json()
          if (!data.ok) throw new Error(data.error || 'Erro desconhecido')
          status.textContent = '✅ Concluído e salvo em data/conversations.json'
          output.textContent = data.final_message
        } catch (err) {
          status.textContent = '⚠️ ' + err.message
          output.textContent = err.stack || String(err)
        }
      })
    </script>
  </body>
</html>
